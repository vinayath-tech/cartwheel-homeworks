name: evals

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-checks:
    name: offline checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Run checks that do not call a model
        run: uv run pytest tests/eval tests/test_cli.py tests/test_db.py tests/test_hw_holes.py tests/test_harbor_adapter.py tests/test_replay_harness.py tests/test_hw6_judge_fidelity.py tests/test_hw6_search_check.py tests/test_hw6_new_checks.py tests/test_hw6_harbor_layout.py -q

  complete-evaluations:
    name: Harbor evaluations
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # The first CI run took 33 minutes before the speed-ups; 60 leaves room.
    timeout-minutes: 60
    env:
      CARTWHEEL_MODEL: ${{ vars.CARTWHEEL_MODEL }}
      PYTHONPATH: ${{ github.workspace }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      # 1. Install Harbor 0.23.0 as a command-line tool and put it on PATH.
      - name: Install Harbor
        run: |
          uv tool install harbor==0.23.0
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      # 2. Generate the classified tasks from eval_cases/cases.jsonl.
      #    The export stops with an error if any case has no kind.
      - name: Generate Harbor tasks
        run: uv run python scripts/export_harbor_tasks.py

      # 3 and 4. Run five attempts per task, each in a fresh Docker container.
      #    --n-concurrent 8 runs eight trials at a time (Harbor's default is
      #    4). Trials mostly wait on the model API, so this fits the runner.
      #    The agent and judge provider keys come from the job's env block
      #    above, which reads them from repository secrets. Harbor passes them
      #    on to the agent and to the verifier.
      - name: Run Harbor evaluations
        run: |
          harbor run \
            -p .harbor/tasks \
            -a harbor_adapter.agent:CartwheelAgent \
            -m "$CARTWHEEL_MODEL" \
            -e docker \
            --n-attempts 5 \
            --n-concurrent 8 \
            --job-name hw6-evals \
            --jobs-dir .harbor/jobs \
            --yes

      # 5. Print pass counts, pass@k, pass^5, and the CI decision per case.
      #    This step exits with an error when a regression case fails, which
      #    fails the job. `if: always()` makes it run even if Harbor failed.
      - name: Summarize results and apply the CI gate
        if: always()
        run: |
          uv run python scripts/summarize_harbor_job.py \
            .harbor/jobs/hw6-evals \
            --expected-attempts 5

      # 6. Keep every trial's files as evidence, even when the job fails.
      - name: Upload Harbor job files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hw6-evals
          path: .harbor/jobs/hw6-evals
          include-hidden-files: true
